;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
framework = stm32cube
build_flags = -D USE_FULL_LL_DRIVER -D EVE_RiTFT50
lib_deps = https://github.com/RudolphRiedel/FT800-FT813/archive/refs/heads/5.x.zip

check_tool = cppcheck
check_flags =
  cppcheck: --addon=cert.py --suppress=unusedFunction

#All these are Nucleo-64 boards

[env:STM32L073]
board = nucleo_l073rz
build_flags =
            ${env.build_flags}
            -D STM32L0
; do not trust any of these values, this example is setup to compile, not to run!
            -D EVE_SPI_NUM=1
            -D EVE_SPI_PORT_NUM=1
            -D EVE_SCK=GPIO_PIN_5
            -D EVE_MOSI=GPIO_PIN_7
            -D EVE_MISO=GPIO_PIN_6
            -D EVE_SPI_PRESCALER=SPI_BAUDRATEPRESCALER_8
            -D EVE_SPI_GPIO_ALT_FUNCTION=GPIO_AF0_SPI1
            -D EVE_CS_PORT_NUM=4
            -D EVE_CS=GPIO_PIN_0
            -D EVE_PD_PORT_NUM=4
            -D EVE_PD=GPIO_PIN_2

